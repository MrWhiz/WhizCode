[package]
name = "whizcode"
version = "0.1.0"
description = "Premium AI-powered Code Editor"
authors = ["MrWhiz"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
tauri = { version = "2.0", features = [] }
tokio = { version = "1", features = ["full"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
regex = "1.10"
urlencoding = "2.1"
walkdir = "2.4"
notify = "6.1"
parking_lot = "0.12"
dashmap = "5.5"
futures = "0.3"
async-trait = "0.1"
num_cpus = "1.16"
open = "5.0"
rfd = "0.16"
reqwest = { version = "0.11", features = ["json"] }
sysinfo = "0.30"
lazy_static = "1.4"
rusqlite = { version = "0.31", features = ["bundled"] }
scraper = "0.19"
log = "0.4"
tempfile = "3.8"
dirs = "5.0"

# Unix-only dependencies
[target.'cfg(unix)'.dependencies]
pty-process = "0.4"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
